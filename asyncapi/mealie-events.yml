gaps:
- No AsyncAPI document, so the event catalog is only discoverable by reading a boolean options schema
  inside the REST contract.
- No webhook signature or shared secret — receivers cannot authenticate Mealie.
- No delivery guarantees, retry policy, event ids or dead-letter surface documented.
- The event notifications go to Apprise destinations, not to arbitrary HTTP endpoints with a typed
  JSON body, so they are hard to consume programmatically.
- WebhookType has exactly one member (mealplan) — the webhook surface cannot notify on recipe or shopping-list
  change even though the notification surface can.
