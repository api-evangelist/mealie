surfaces:
- name: Scheduled meal-plan webhooks
  kind: outbound-http-webhook
  trigger: time-based, not event-based
  description: 'A webhook is configured with a scheduledTime (a time of day) and Mealie POSTs that day''s
    meal plan to the configured URL at that time. WebhookType is an enum with exactly ONE member: "mealplan".
    This is a scheduled digest, not a change-notification stream — there is no signature, no delivery-retry
    policy, no event id and no replay in the contract.'
  management_operations:
  - get_all_api_households_webhooks_get
  - create_one_api_households_webhooks_post
  - get_one_api_households_webhooks__item_id__get
  - update_one_api_households_webhooks__item_id__put
  - delete_one_api_households_webhooks__item_id__delete
  - rerun_webhooks_api_households_webhooks_rerun_post
  - test_one_api_households_webhooks__item_id__test_post
  config_schema: CreateWebhook / ReadWebhook — {enabled, name, url, webhookType, scheduledTime, groupId,
    householdId, id}
  payload: The household's meal plan for the day. Recipe `extras` key/value pairs travel with the payload,
    which is the documented mechanism for triggering downstream automation.
  replay: rerun_webhooks_api_households_webhooks_rerun_post re-fires today's scheduled webhooks on demand.
  security:
    signing: false
    shared_secret: false
    note: No HMAC signature header, no shared secret and no mTLS in the contract. A receiver cannot verify
      that a POST came from Mealie.
- name: Event notifications (Apprise)
  kind: outbound-notification
  trigger: event-based
  description: 'Twenty-seven individually toggleable notification triggers per notifier — 25 named domain events across recipes, meal plans, shopping lists, cookbooks, tags, categories, labels, user signup and data import/export/migration, plus a testMessage diagnostic and a webhookTask toggle. Delivery is
    NOT a raw webhook — it is handed to Apprise, which fans out to 80+ notification backends (Discord,
    Slack, Matrix, ntfy, email, Home Assistant and so on) via an appriseUrl. That makes it a notification
    channel rather than an integration event bus: the payload shape is Apprise''s, and a machine consumer
    receives a formatted message, not a typed domain object.'
  management_operations:
  - get_all_api_households_events_notifications_get
