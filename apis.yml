  description: The Mealie REST API — 264 operations across 180 paths covering recipes, cookbooks,
    meal plans, shopping lists, households, groups, organizers, users, webhooks, event notifications
    and admin maintenance. Served by every Mealie instance from its own host; the project operates
    a public demo instance whose OpenAPI document is the harvested contract here.
