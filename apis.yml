  x-base-url-note: 'repair-api-bases.py returns `no-usable-base` for Mealie and it is right to flag
    it: demo.mealie.io is a demonstration host, not production. There IS no production host. Mealie
    is AGPL-3.0 self-hosted software, so the real base is templated — the docs say http(s)://<your-mealie-site>/api
    — and the only host the project itself operates and points integrators at is the public demo
    ("see the example at the Demo Site", https://docs.mealie.io/documentation/getting-started/api-usage/).
    baseURL is therefore recorded as https://demo.mealie.io/api: a real, reachable, provider-operated
    host that serves the harvested contract. The templated form https://{host}/api is carried in
    overlays/mealie-openapi-overlay.yaml, because the harvested spec declares no servers[] at all.'
