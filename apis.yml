aid: mealie
name: Mealie
description: 'Mealie is an open-source (AGPL-3.0), self-hosted recipe manager, meal planner and shopping-list
  application built on a FastAPI REST backend and a Vue frontend. Every feature in the UI is driven
  by the same public REST API: recipe CRUD and import-by-URL scraping, AI-assisted recipe creation,
  cookbooks, meal plans and mealplan rules, shopping lists and list items with cross-application
  "extras" key/value pairs, households and groups with multi-purpose labels, food/unit/tool organizers,
  a public "Explore" surface for unauthenticated browsing of shared content, scheduled webhooks,
  Apprise-backed event notifications, and admin backup/maintenance operations. The instance publishes
  its own OpenAPI 3.1 document and interactive Swagger UI at /openapi.json and /docs, authenticates
  with long-lived bearer API tokens (plus OIDC and LDAP for user login), and shares a uniform pagination,
  filtering and ordering grammar across nearly every collection endpoint.'
