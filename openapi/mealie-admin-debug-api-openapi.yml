openapi: 3.2.0
info:
  title: 'Mealie Admin: Debug API'
  description: '

    Mealie is a web application for managing your recipes, meal plans, and shopping lists. This is the Restful

    API interactive documentation that can be used to explore the API. If you''re justing getting started with

    the API and want to get started quickly, you can use the

    [API Usage | Mealie Docs](https://docs.mealie.io/documentation/getting-started/api-usage/)

    as a reference for how to get started.



    If you have any questions or comments about mealie, please use the discord server to talk to the developers or other

    community members. If you''d like to file an issue, please use the

    [GitHub Issue Tracker | Mealie](https://github.com/mealie-recipes/mealie/issues/new/choose)



    ## Helpful Links

    - [Home Page](https://mealie.io)

    - [Documentation](https://docs.mealie.io)

    - [Discord](https://discord.gg/QuStdQGSGK)

    - [Demo](https://demo.mealie.io)

    '
  version: nightly
tags:
- name: 'Admin: Debug'
paths:
  /api/admin/debug/openai/{provider_id}:
    post:
      tags:
      - 'Admin: Debug'
      summary: Debug Openai
      operationId: debug_openai_api_admin_debug_openai__provider_id__post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Provider Id
      - name: accept-language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_debug_openai_api_admin_debug_openai__provider_id__post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DebugResponse:
      properties:
        success:
          type: boolean
          title: Success
        response:
          anyOf:
          - type: string
          - type: 'null'
          title: Response
      type: object
      required:
      - success
      title: DebugResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_debug_openai_api_admin_debug_openai__provider_id__post:
      properties:
        image:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Image
      type: object
      title: Body_debug_openai_api_admin_debug_openai__provider_id__post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/auth/token
