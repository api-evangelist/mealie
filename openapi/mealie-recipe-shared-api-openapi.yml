openapi: 3.2.0
info:
  title: 'Mealie Recipe: Shared API'
  description: '

    Mealie is a web application for managing your recipes, meal plans, and shopping lists. This is the Restful

    API interactive documentation that can be used to explore the API. If you''re justing getting started with

    the API and want to get started quickly, you can use the

    [API Usage | Mealie Docs](https://docs.mealie.io/documentation/getting-started/api-usage/)

    as a reference for how to get started.



    If you have any questions or comments about mealie, please use the discord server to talk to the developers or other

    community members. If you''d like to file an issue, please use the

    [GitHub Issue Tracker | Mealie](https://github.com/mealie-recipes/mealie/issues/new/choose)



    ## Helpful Links

    - [Home Page](https://mealie.io)

    - [Documentation](https://docs.mealie.io)

    - [Discord](https://discord.gg/QuStdQGSGK)

    - [Demo](https://demo.mealie.io)

    '
  version: nightly
tags:
- name: 'Recipe: Shared'
paths:
  /api/recipes/shared/{token_id}:
    get:
      tags:
      - 'Recipe: Shared'
      summary: Get Shared Recipe
      operationId: get_shared_recipe_api_recipes_shared__token_id__get
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Token Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe-Output'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recipes/shared/{token_id}/zip:
    get:
      tags:
      - 'Recipe: Shared'
      summary: Get Shared Recipe As Zip
      description: Get a recipe and its original image as a Zip file
      operationId: get_shared_recipe_as_zip_api_recipes_shared__token_id__zip_get
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid4
          title: Token Id
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
