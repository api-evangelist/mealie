openapi: 3.2.0
info:
  title: 'Mealie Explore: Recipes API'
  description: '

    Mealie is a web application for managing your recipes, meal plans, and shopping lists. This is the Restful

    API interactive documentation that can be used to explore the API. If you''re justing getting started with

    the API and want to get started quickly, you can use the

    [API Usage | Mealie Docs](https://docs.mealie.io/documentation/getting-started/api-usage/)

    as a reference for how to get started.



    If you have any questions or comments about mealie, please use the discord server to talk to the developers or other

    community members. If you''d like to file an issue, please use the

    [GitHub Issue Tracker | Mealie](https://github.com/mealie-recipes/mealie/issues/new/choose)



    ## Helpful Links

    - [Home Page](https://mealie.io)

    - [Documentation](https://docs.mealie.io)

    - [Discord](https://discord.gg/QuStdQGSGK)

    - [Demo](https://demo.mealie.io)

    '
  version: nightly
tags:
- name: 'Explore: Recipes'
paths:
  /api/explore/groups/{group_slug}/recipes:
    get:
      tags:
      - 'Explore: Recipes'
      summary: Get All
      operationId: get_all_api_explore_groups__group_slug__recipes_get
      parameters:
      - name: group_slug
        in: path
        required: true
        schema:
          type: string
          title: Group Slug
      - name: categories
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              anyOf:
              - type: string
                format: uuid4
              - type: string
          - type: 'null'
          title: Categories
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              anyOf:
              - type: string
                format: uuid4
              - type: string
          - type: 'null'
          title: Tags
      - name: tools
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              anyOf:
              - type: string
                format: uuid4
              - type: string
          - type: 'null'
          title: Tools
      - name: foods
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              anyOf:
              - type: string
                format: uuid4
              - type: string
          - type: 'null'
          title: Foods
      - name: households
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              anyOf:
              - type: string
                format: uuid4
              - type: string
          - type: 'null'
          title: Households
      - name: orderBy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Orderby
      - name: orderByNullPosition
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderByNullPosition'
          - type: 'null'
          title: Orderbynullposition
      - name: orderDirection
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderDirection'
          default: desc
      - name: queryFilter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Queryfilter
      - name: paginationSeed
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Paginationseed
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: perPage
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Perpage
      - name: cookbook
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: string
          - type: 'null'
          title: Cookbook
      - name: requireAllCategories
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Requireallcategories
      - name: requireAllTags
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Requirealltags
      - name: requireAllTools
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Requirealltools
      - name: requireAllFoods
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Requireallfoods
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: accept-language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationBase_RecipeSummary_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/explore/groups/{group_slug}/recipes/suggestions:
    get:
      tags:
      - 'Explore: Recipes'
      summary: Suggest Recipes
      operationId: suggest_recipes_api_explore_groups__group_slug__recipes_suggestions_get
      parameters:
      - name: group_slug
        in: path
        required: true
        schema:
          type: string
          title: Group Slug
      - name: foods
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid4
          - type: 'null'
          title: Foods
      - name: tools
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid4
          - type: 'null'
          title: Tools
      - name: orderBy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Orderby
      - name: orderByNullPosition
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderByNullPosition'
          - type: 'null'
          title: Orderbynullposition
      - name: orderDirection
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderDirection'
          default: desc
      - name: queryFilter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Queryfilter
      - name: paginationSeed
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Paginationseed
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
          title: Limit
      - name: maxMissingFoods
        in: query
        required: false
        schema:
          type: integer
          default: 5
          title: Maxmissingfoods
      - name: maxMissingTools
        in: query
        required: false
        schema:
          type: integer
          default: 5
          title: Maxmissingtools
      - name: includeFoodsOnHand
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Includefoodsonhand
      - name: includeToolsOnHand
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Includetoolsonhand
      - name: accept-language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSuggestionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/explore/groups/{group_slug}/recipes/{recipe_slug}:
    get:
      tags:
      - 'Explore: Recipes'
      summary: Get Recipe
      operationId: get_recipe_api_explore_groups__group_slug__recipes__recipe_slug__get
      parameters:
      - name: recipe_slug
        in: path
        required: true
        schema:
          type: string
          title: Recipe Slug
      - name: group_slug
        in: path
        required: true
        schema:
          type: string
          title: Group Slug
      - name: accept-language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe-Output'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
