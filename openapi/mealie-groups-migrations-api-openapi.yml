openapi: 3.2.0
info:
  title: 'Mealie Groups: Migrations API'
  description: Mealie is a web application for managing your recipes, meal plans, and shopping lists.
  version: nightly
tags:
- name: 'Groups: Migrations'
paths:
  /api/groups/migrations:
    post:
      tags:
      - 'Groups: Migrations'
      summary: Start Data Migration
      operationId: start_data_migration_api_groups_migrations_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: accept-language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_start_data_migration_api_groups_migrations_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_start_data_migration_api_groups_migrations_post:
      properties:
        add_migration_tag:
          type: boolean
          title: Add Migration Tag
          default: false
        migration_type:
          $ref: '#/components/schemas/SupportedMigrations'
        archive:
          type: string
          contentMediaType: application/octet-stream
          title: Archive
      type: object
      required:
      - migration_type
      - archive
      title: Body_start_data_migration_api_groups_migrations_post
    SupportedMigrations:
      type: string
      enum:
      - nextcloud
      - chowdown
      - copymethat
      - paprika
      - mealie_alpha
      - tandoor
      - plantoeat
      - myrecipebox
      - recipekeeper
      - cookn
      title: SupportedMigrations
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ReportSummaryStatus:
      type: string
      enum:
      - in-progress
      - success
      - failure
      - partial
      title: ReportSummaryStatus
    ReportSummary:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        category:
          $ref: '#/components/schemas/ReportCategory'
        groupId:
          type: string
          format: uuid4
          title: Groupid
        name:
          type: string
          title: Name
        status:
          $ref: '#/components/schemas/ReportSummaryStatus'
          default: in-progress
        id:
          type: string
          format: uuid4
          title: Id
      type: object
      required:
      - category
      - groupId
      - name
      - id
      title: ReportSummary
    ReportCategory:
      type: string
      enum:
      - backup
      - restore
      - migration
      - bulk_import
      title: ReportCategory
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/auth/token
