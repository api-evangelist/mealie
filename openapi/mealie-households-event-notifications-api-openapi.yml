          title: Tagupdated
          default: false
        tagDeleted:
          type: boolean
          title: Tagdeleted
          default: false
        categoryCreated:
          type: boolean
          title: Categorycreated
          default: false
        categoryUpdated:
          type: boolean
          title: Categoryupdated
          default: false
        categoryDeleted:
          type: boolean
          title: Categorydeleted
          default: false
        labelCreated:
          type: boolean
          title: Labelcreated
