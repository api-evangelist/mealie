      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OrderDirection:
      type: string
      enum:
      - asc
      - desc
      title: OrderDirection
    GroupEventNotifierOut:
      properties:
        id:
          type: string
          format: uuid4
          title: Id
        name:
          type: string
          title: Name
        enabled:
          type: boolean
          title: Enabled
        groupId:
          type: string
          format: uuid4
          title: Groupid
        householdId:
          type: string
          format: uuid4
          title: Householdid
        options:
          $ref: '#/components/schemas/GroupEventNotifierOptionsOut'
      type: object
      required:
      - id
      - name
      - enabled
      - groupId
      - householdId
      - options
      title: GroupEventNotifierOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    OrderByNullPosition:
      type: string
      enum:
      - first
      - last
      title: OrderByNullPosition
    GroupEventNotifierCreate:
      properties:
        name:
          type: string
          title: Name
        appriseUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Appriseurl
      type: object
      required:
      - name
      title: GroupEventNotifierCreate
    GroupEventNotifierUpdate:
      properties:
        name:
          type: string
          title: Name
        appriseUrl:
          anyOf:
          - type: string
          - type: 'null'
          title: Appriseurl
        enabled:
          type: boolean
          title: Enabled
          default: true
        groupId:
          type: string
          format: uuid4
          title: Groupid
        householdId:
          type: string
          format: uuid4
          title: Householdid
        options:
          $ref: '#/components/schemas/GroupEventNotifierOptions'
          default:
            testMessage: false
            webhookTask: false
            recipeCreated: false
            recipeUpdated: false
            recipeDeleted: false
            userSignup: false
            dataMigrations: false
            dataExport: false
            dataImport: false
            mealplanEntryCreated: false
            mealplanEntryUpdated: false
            mealplanEntryDeleted: false
            shoppingListCreated: false
            shoppingListUpdated: false
            shoppingListDeleted: false
            cookbookCreated: false
            cookbookUpdated: false
            cookbookDeleted: false
            tagCreated: false
            tagUpdated: false
            tagDeleted: false
            categoryCreated: false
            categoryUpdated: false
            categoryDeleted: false
            labelCreated: false
            labelUpdated: false
            labelDeleted: false
        id:
          type: string
          format: uuid4
          title: Id
      type: object
      required:
      - name
      - groupId
      - householdId
      - id
      title: GroupEventNotifierUpdate
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/auth/token
