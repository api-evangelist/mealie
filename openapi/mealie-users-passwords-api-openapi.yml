openapi: 3.2.0
info:
  title: 'Mealie Users: Passwords API'
  description: Mealie is a web application for managing your recipes, meal plans, and shopping lists.
  version: nightly
tags:
- name: 'Users: Passwords'
paths:
  /api/users/forgot-password:
    post:
      tags:
      - 'Users: Passwords'
      summary: Forgot Password
      description: Sends an email with a reset link to the user
      operationId: forgot_password_api_users_forgot_password_post
      parameters:
      - name: accept-language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/reset-password:
    post:
      tags:
      - 'Users: Passwords'
      summary: Reset Password
      description: Resets the user password
      operationId: reset_password_api_users_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ForgotPassword:
      properties:
        email:
          type: string
          title: Email
      type: object
      required:
      - email
      title: ForgotPassword
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ResetPassword:
      properties:
        token:
          type: string
          title: Token
        email:
          type: string
          title: Email
        password:
          type: string
          title: Password
        passwordConfirm:
          type: string
          title: Passwordconfirm
      type: object
      required:
      - token
      - email
      - password
      - passwordConfirm
      title: ResetPassword
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/auth/token
