domain_standard:
  market: recipes / food and cooking data
  standard: schema.org Recipe
  conforms: true
  role: consumer-and-parser
  evidence:
    spec_location: >-
      openapi/mealie-openapi.json — paths./api/recipes/create/html-or-json.post.description
      and paths./api/recipes/create/html-or-json/stream.post.description
    quoted: >-
      "Takes in raw HTML or a https://schema.org/Recipe object as a JSON string and
      parses it like a URL"
    operations:
    - create_recipe_from_html_or_json_api_recipes_create_html_or_json_post
    - create_recipe_from_html_or_json_stream_api_recipes_create_html_or_json_stream_post
    - parse_recipe_url_api_recipes_create_url_post
    - test_parse_recipe_url_api_recipes_test_scrape_url_post
  note: >-
    This is a real domain-standard signature declared by the CONTRACT itself, not a
    marketing claim: Mealie accepts a schema.org/Recipe JSON-LD object directly as a
    creation payload, and its URL-import path works by extracting schema.org/Recipe
    microdata from third-party cooking sites. For an integrator who already holds
    schema.org Recipe data — which is the near-universal publishing format for recipes
    on the open web — there is no bespoke mapping to write on the way in.
  limitation: >-
    The standard is honoured on INPUT only. Mealie's own read models
    (Recipe-Output, RecipeSummary) are Mealie-shaped, not schema.org-shaped, and the
    only export format the contract offers is ExportTypes: [json] — Mealie's own JSON.
    So an agent can hand Mealie schema.org and get a recipe, but cannot ask Mealie for
    schema.org back. That asymmetry is the gap worth reporting to the project.
