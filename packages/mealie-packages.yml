summary:
  official_sdks: 0
  note: >-
    THE HEADLINE FINDING: Mealie publishes NO first-party client SDK in any package
    registry. The mealie-recipes GitHub organisation ships the application itself and
    nothing else installable as a library — searches of npm, PyPI, RubyGems, crates.io,
    Packagist, NuGet, Maven Central and pkg.go.dev return only third-party wrappers.
    The project's own distribution channel is a container image, and its "SDK" story
    is the interactive Swagger UI every instance serves at /docs. Because there is no
    official SDK, no `SDKs` pointer is emitted for this provider — every entry below
    with official:false is somebody else's work.
