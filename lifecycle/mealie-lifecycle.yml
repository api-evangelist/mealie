    path: POST /api/households/shopping/lists/{item_id}/recipe/{recipe_id}
    marked_in_spec: true
    replacement: add_recipe_ingredients_to_list_api_households_shopping_lists__item_id__recipe_post
    sunset_date: null
  note: >-
    Mealie publishes no deprecation policy and emits no Sunset/Deprecation headers.
    Exactly one operation carries `deprecated: true` in the contract. Breaking
    changes are communicated in release notes and version-flagged docs callouts (the
    OIDC v2 migration guide, the v3.21.0 email_verified requirement) rather than
    through a deprecation lifecycle.
