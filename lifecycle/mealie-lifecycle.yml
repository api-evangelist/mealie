versioning:
  api_versioned: false
  scheme: >-
    The REST API carries no version segment and no version header — it moves with the
    application. Application releases are semver-tagged (v3.24.0, 2026-08-24) and the
    demo instance reports info.version "nightly", which means the harvested contract
    describes the mealie-next branch rather than a numbered release.
  release_notes: https://github.com/mealie-recipes/mealie/releases
  see: changelog/mealie-changelog.yml
